version: 2
updates:
    # Maintain dependencies for GitHub Actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"

    # Maintain dependencies for npm
    - package-ecosystem: "npm"
      target-branch: "master"
      directory: "/"
      schedule:
          interval: "daily"
      versioning-strategy: "increase"
      open-pull-requests-limit: 20
      commit-message:
          prefix: "fix"
          prefix-development: "build"
          include: "scope"
      groups:
          majorProd:
              applies-to: version-updates
              dependency-type: production
              update-types:
                  - "major"
          majorDev:
              applies-to: version-updates
              dependency-type: development
              update-types:
                  - "major"
          minorAndPatch:
              applies-to: version-updates
              update-types:
                  - "patch"
                  - "minor"

    # Maintain the base image of the sandbox image
    - package-ecosystem: "docker"
      directory: "/images/sandbox-dev"
      schedule:
          interval: "daily"
      # the image is published as `trixie`: a Debian release is a new image, not a bump
      ignore:
          - dependency-name: "debian"
            update-types: ["version-update:semver-major"]
      commit-message:
          prefix: "build"

    # Maintain the base image of the deprecated sandbox-node image
    - package-ecosystem: "docker"
      directory: "/images/sandbox-node"
      schedule:
          interval: "daily"
      # the image is published as `24`: a Node.js major is a new image, not a bump
      ignore:
          - dependency-name: "node"
            update-types: ["version-update:semver-major"]
      commit-message:
          prefix: "build"

    # Maintain the base image of the app runtime image
    - package-ecosystem: "docker"
      directory: "/images/node"
      schedule:
          interval: "daily"
      # the image is published as `24`: a Node.js major is a new image, not a bump
      ignore:
          - dependency-name: "node"
            update-types: ["version-update:semver-major"]
      commit-message:
          prefix: "build"
